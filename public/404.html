<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>USA Review Store</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages Custom Domain 404 Handler
      // Redirects sub-routes back to root with query string so React SPA handles routing smoothly
      var pathSegmentsToKeep = 0; // 0 for custom apex/sub domain
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
