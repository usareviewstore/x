<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>USA Review Store</title>
    <script type="text/javascript">
      // Auto-detect pathSegmentsToKeep: 1 for *.github.io/repo, 0 for custom apex/sub domains
      var isGithubIo = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGithubIo ? 1 : 0;
      var l = window.location;
      var segmentPath = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        segmentPath + '/?' + (redirectPath ? '/' + redirectPath : '') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
