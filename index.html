<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>USA Review Store | #1 Organic Reputation & Verified Reviews Platform</title>
    <!-- GitHub Pages Single Page App Redirect Decoder -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null,
              basePath + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
